<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img">
  <title>MiOpIIk Agent Architecture: Mind, Ink, Operator</title>
  <desc>One foreground conversation (Mind), one middle-layer ledger and compiler (Ink), and one background execution layer (Operator) aligned across two timelines.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2; }
    .ink-panel { fill: #f1f5ff; stroke: #3650de; stroke-width: 1.5; }
    .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .node-mind { fill: #ffffff; stroke: #2b6cb0; stroke-width: 1.5; }
    .node-op { fill: #ffffff; stroke: #108792; stroke-width: 1.5; }
    .fg { fill: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub { fill: #475569; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mut { fill: #64748b; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .code { fill: #1e293b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .spine-fg { stroke: #3650de; stroke-width: 2; }
    .spine-bg { stroke: #108792; stroke-width: 2; }
    .flow { stroke: #475569; stroke-width: 1.4; fill: none; }
    .flow-dash { stroke: #3650de; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .flow-op { stroke: #108792; stroke-width: 1.4; fill: none; }
    .arr { fill: #475569; }
    .arr-ink { fill: #3650de; }
    .arr-op { fill: #108792; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14161a; }
      .panel { fill: #1b1e24; stroke: #2e333d; }
      .ink-panel { fill: #192132; stroke: #5b8bf0; }
      .node { fill: #20242c; stroke: #383e4c; }
      .node-mind { fill: #1c2433; stroke: #658eff; }
      .node-op { fill: #18292d; stroke: #51cfdb; }
      .fg { fill: #f1f5f9; }
      .sub { fill: #cbd5e1; }
      .mut { fill: #94a3b8; }
      .code { fill: #e2e8f0; }
      .spine-fg { stroke: #658eff; }
      .spine-bg { stroke: #51cfdb; }
      .flow { stroke: #94a3b8; }
      .flow-dash { stroke: #658eff; }
      .flow-op { stroke: #51cfdb; }
      .arr { fill: #94a3b8; }
      .arr-ink { fill: #658eff; }
      .arr-op { fill: #51cfdb; }
    }
  </style>
  <defs>
    <marker id="m-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="arr"/>
    </marker>
    <marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="arr-ink"/>
    </marker>
    <marker id="m-op" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="arr-op"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="480" rx="12"/>

  <!-- Header -->
  <text x="36" y="38" font-size="17" font-weight="700" class="fg">MiOpIIk Agent · Three Layers across Two Timelines</text>
  <text x="36" y="60" font-size="12.5" class="sub">Mind owns the user-facing conversation; Ink maintains the append-only ledger and compiles context; Operator executes contracted slices.</text>

  <!-- Column headers -->
  <text x="145" y="94" font-size="12" font-weight="600" text-anchor="middle" class="sub">Foreground Timeline · Mind</text>
  <text x="440" y="94" font-size="12" font-weight="600" text-anchor="middle" class="sub">Middle Layer · Ink (.dsh/miopiik/)</text>
  <text x="735" y="94" font-size="12" font-weight="600" text-anchor="middle" class="sub">Background Timeline · Operator</text>

  <!-- Left column: Mind -->
  <rect class="node" x="45" y="112" width="200" height="52" rx="8"/>
  <text x="145" y="135" font-size="13" font-weight="600" text-anchor="middle" class="fg">1. User Turn</text>
  <text x="145" y="153" font-size="11" text-anchor="middle" class="mut">Real prompt enters the session</text>

  <line x1="145" y1="164" x2="145" y2="196" class="spine-fg" marker-end="url(#m-ink)"/>

  <rect class="node-mind" x="45" y="202" width="200" height="76" rx="8"/>
  <text x="145" y="225" font-size="13" font-weight="600" text-anchor="middle" class="fg">2. Mind (Trunk)</text>
  <text x="145" y="244" font-size="11" text-anchor="middle" class="sub">Sole user-facing role</text>
  <text x="145" y="256" font-size="10.5" text-anchor="middle" class="code">ink_loops / ink_facts</text>
  <text x="145" y="271" font-size="10.5" text-anchor="middle" class="code">ink_branch / ink_dispatch</text>

  <line x1="145" y1="278" x2="145" y2="310" class="spine-fg" marker-end="url(#m-ink)"/>

  <rect class="node" x="45" y="316" width="200" height="62" rx="8"/>
  <text x="145" y="339" font-size="13" font-weight="600" text-anchor="middle" class="fg">3. Commit Gate &amp; Next Turn</text>
  <text x="145" y="357" font-size="11" text-anchor="middle" class="sub">Outward change via ink_commit</text>
  <text x="145" y="372" font-size="10.5" text-anchor="middle" class="mut">L3 context injected at turn boundary</text>

  <!-- Center column: Ink -->
  <rect class="ink-panel" x="295" y="112" width="290" height="296" rx="10"/>
  <text x="440" y="138" font-size="14" font-weight="700" text-anchor="middle" class="fg">Ink · Ledger &amp; Compiler</text>
  <text x="440" y="156" font-size="11" text-anchor="middle" class="sub">Append-only JSONL · No direct user speech</text>

  <rect class="node" x="315" y="170" width="250" height="44" rx="6"/>
  <text x="327" y="189" font-size="11.5" font-weight="600" class="fg">Observe &amp; Context</text>
  <text x="327" y="205" font-size="10.5" class="code">observations / ink-context / details</text>

  <rect class="node" x="315" y="222" width="250" height="44" rx="6"/>
  <text x="327" y="241" font-size="11.5" font-weight="600" class="fg">Working Memory &amp; Governance</text>
  <text x="327" y="257" font-size="10.5" class="code">loops / facts / branches / drafts</text>

  <rect class="node" x="315" y="274" width="250" height="44" rx="6"/>
  <text x="327" y="293" font-size="11.5" font-weight="600" class="fg">Compile &amp; Tiered Inbox</text>
  <text x="327" y="309" font-size="10.5" class="code">notes / inbox (T0-T3) / cases</text>

  <rect class="node" x="315" y="326" width="250" height="44" rx="6"/>
  <text x="327" y="345" font-size="11.5" font-weight="600" class="fg">Fold, Handoff &amp; Watchdogs</text>
  <text x="327" y="361" font-size="10.5" class="code">folds / briefings / jobs (stall/timeout)</text>

  <text x="440" y="392" font-size="10.5" text-anchor="middle" class="mut">12 Mind tools · 2 Operator tools (isolated)</text>

  <!-- Right column: Operator -->
  <rect class="node" x="635" y="112" width="200" height="58" rx="8"/>
  <text x="735" y="134" font-size="13" font-weight="600" text-anchor="middle" class="fg">Contract + Fishbone Slice</text>
  <text x="735" y="151" font-size="11" text-anchor="middle" class="sub">6-part contract + branch B-n</text>
  <text x="735" y="164" font-size="10" text-anchor="middle" class="mut">No chat transcript passed</text>

  <line x1="735" y1="170" x2="735" y2="200" class="spine-bg" marker-end="url(#m-op)"/>

  <rect class="node-op" x="635" y="206" width="200" height="68" rx="8"/>
  <text x="735" y="229" font-size="13" font-weight="600" text-anchor="middle" class="fg">Operator Subagent</text>
  <text x="735" y="247" font-size="11" text-anchor="middle" class="sub">Isolated background execution</text>
  <text x="735" y="263" font-size="10.5" text-anchor="middle" class="code">ink_ask (citation or escalate)</text>

  <line x1="735" y1="274" x2="735" y2="310" class="spine-bg" marker-end="url(#m-op)"/>

  <rect class="node" x="635" y="316" width="200" height="62" rx="8"/>
  <text x="735" y="339" font-size="13" font-weight="600" text-anchor="middle" class="fg">Structured Return</text>
  <text x="735" y="357" font-size="10.5" text-anchor="middle" class="code">ink_report (claim + evidence)</text>
  <text x="735" y="372" font-size="10.5" text-anchor="middle" class="mut">Compiled into inbox preview</text>

  <!-- Cross-column connectors -->
  <!-- Observe: Turn -> Ink -->
  <path d="M 245 138 C 268 138, 272 186, 311 186" class="flow" marker-end="url(#m-flow)"/>
  <!-- Mind <-> Ink tool calls -->
  <path d="M 245 242 L 311 242" class="flow" marker-end="url(#m-flow)"/>
  <!-- Ink -> Next Turn (L3) -->
  <path d="M 315 298 C 278 298, 274 346, 249 346" class="flow-dash" marker-end="url(#m-ink)"/>
  <!-- Ink -> Operator dispatch -->
  <path d="M 565 242 C 600 242, 598 142, 631 142" class="flow-op" marker-end="url(#m-op)"/>
  <!-- Operator -> Ink report -->
  <path d="M 635 346 C 600 346, 598 298, 569 298" class="flow-op" marker-end="url(#m-op)"/>

  <!-- Footer note -->
  <rect class="panel" x="36" y="424" width="808" height="36" rx="8"/>
  <text x="440" y="446" font-size="11.5" text-anchor="middle" class="sub">Companion package: miopiik-iui (independent declarative Markdown UI plugin; optional, zero shared runtime dependencies).</text>
</svg>
